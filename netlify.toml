[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Bezpečnostní hlavičky pro statický hosting na Netlify.
# CSP je záměrně bez script-src omezení (statický export + inline JSON-LD),
# zpřísňuje aspoň frame/object/base a povoluje embed pouze z YouTube.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://matomo.zbyneksvoboda.cz; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# Dlouhé cachování verzovaných statických assetů z Next buildu.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonty a obrázky v /public se mění zřídka.
[[headers]]
  for = "/:all.(woff2|woff|ttf|png|webp|ico|svg)"
  [headers.values]
    Cache-Control = "public, max-age=604800"
